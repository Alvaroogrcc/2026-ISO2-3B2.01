name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [cliente, servidor]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -am incluye el POM padre; cada módulo se comprueba de forma independiente.
      - name: Compilar y pasar los tests de ${{ matrix.modulo }}
        run: mvn -B -pl ${{ matrix.modulo }} -am verify

  javadoc:
    name: Generar y publicar Javadoc
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # javadoc:aggregate genera una única página con cliente + servidor.
      - name: Generar Javadoc agregado
        run: mvn -B javadoc:aggregate

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/apidocs

      # Publica desde develop (rama por defecto) y desde main (producción).
      # En PRs solo se comprueba que el Javadoc se genera sin errores.
      - name: Publicar en GitHub Pages
        id: deploy
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/deploy-pages@v5
